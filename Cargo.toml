[package]
name = "zview-desktop"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gpui-kit = "=0.7.3"
lyon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Match Kit 0.7.3's GPUI snapshot. Enabling Kit's test-support feature also
# resolves its optional Fast backend, whose pinned dependencies conflict here.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

# Keep first browser builds quick without shipping debug information.
[profile.web]
inherits = "dev"
debug = 0
