<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 940" role="img" aria-labelledby="title desc">
  <title id="title">ZView live session screen proposal</title>
  <desc id="desc">Dark purple ZView desktop screen showing the Threads overview and an open Live session menu with connection details, disconnect, open dump, and open recording actions.</desc>
  <defs>
    <linearGradient id="window" x2="0" y2="1">
      <stop stop-color="#27223e"/>
      <stop offset="1" stop-color="#1e1d34"/>
    </linearGradient>
    <linearGradient id="cpu" x2="0" y2="1">
      <stop stop-color="#ac91f5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ac91f5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stack" x2="0" y2="1">
      <stop stop-color="#69cbb1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#69cbb1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heap" x2="0" y2="1">
      <stop stop-color="#75b3f1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#75b3f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#0d0b1b" flood-opacity=".72"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6dfef; }
      .muted { fill: #a59bb8; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .medium { font-size: 16px; }
      .line { stroke: #39324e; stroke-width: 1; }
      .grid { stroke: #39324e; stroke-width: 1; opacity: .6; }
    </style>
  </defs>

  <!-- Window and existing sidebar -->
  <rect width="1480" height="940" fill="#171525"/>
  <rect x="12" y="12" width="1456" height="916" rx="14" fill="url(#window)" stroke="#504564"/>
  <path d="M26 12H242V928H26Q12 928 12 914V26Q12 12 26 12Z" fill="#23213b"/>
  <path d="M242 12V928" class="line"/>
  <rect x="30" y="33" width="36" height="36" rx="9" fill="#7561cd"/>
  <text x="48" y="58" font-size="21" font-weight="700" text-anchor="middle">Z</text>
  <text x="78" y="51" font-size="17" font-weight="700">ZView</text>
  <text x="78" y="68" class="tiny muted">Zephyr runtime inspector</text>
  <text x="34" y="120" class="tiny muted" letter-spacing="1.7">MONITOR</text>
  <rect x="25" y="137" width="203" height="41" rx="7" fill="#3d365b"/>
  <rect x="25" y="144" width="3" height="27" rx="1.5" fill="#ac91f5"/>
  <path d="M41 158h6v-8h5v17h5v-11h5" fill="none" stroke="#c6adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="163" class="small" font-weight="600">Threads</text>
  <rect x="40" y="192" width="18" height="18" rx="4" fill="none" stroke="#a59bb8" stroke-width="1.5"/>
  <path d="M45 198h8m-8 5h8" stroke="#a59bb8" stroke-width="1.5"/>
  <text x="76" y="206" class="small muted">Kernel objects</text>
  <text x="34" y="270" class="tiny muted" letter-spacing="1.7">SESSION</text>
  <circle cx="49" cy="303" r="9" fill="none" stroke="#a59bb8" stroke-width="1.5"/>
  <text x="49" y="308" font-size="13" text-anchor="middle" class="muted">i</text>
  <text x="76" y="308" class="small muted">Help &amp; shortcuts</text>
  <path d="M26 850H228" class="line"/>
  <text x="34" y="874" class="tiny muted" letter-spacing="1.5">LIVE TARGET</text>
  <circle cx="41" cy="895" r="4" fill="#69cbb1"/>
  <text x="54" y="900" class="small">nRF5340 · J-Link</text>
  <text x="34" y="916" class="tiny muted">Latest sample: just now</text>

  <!-- Existing toolbar, replacing only its three buttons with a session control -->
  <rect x="258" y="29" width="38" height="36" rx="7" fill="#302b46" stroke="#39324e"/>
  <path d="M268 41h18m-18 6h18m-18 6h18" stroke="#ded5eb" stroke-width="1.7" stroke-linecap="round"/>
  <text x="312" y="53" class="small muted">Monitor</text>
  <text x="374" y="53" class="small muted">/</text>
  <text x="392" y="53" class="medium" font-weight="600">Threads</text>
  <rect x="1243" y="28" width="207" height="40" rx="8" fill="#302b46" stroke="#7965a5"/>
  <circle cx="1263" cy="48" r="5" fill="#69cbb1"/>
  <text x="1277" y="53" class="small" font-weight="600">Live · nRF5340</text>
  <path d="m1424 45 6 6 6-6" fill="none" stroke="#c8bdd6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Overview content matches the current layout hierarchy -->
  <text x="258" y="117" font-size="25" font-weight="650">Threads</text>
  <text x="258" y="139" class="small muted">Runtime activity and thread stack usage</text>

  <!-- Three existing summary chart cards -->
  <rect x="258" y="160" width="385" height="257" rx="10" fill="#25223b" stroke="#39324e"/>
  <rect x="655" y="160" width="385" height="257" rx="10" fill="#25223b" stroke="#39324e"/>
  <rect x="1052" y="160" width="398" height="257" rx="10" fill="#25223b" stroke="#39324e"/>
  <text x="277" y="189" class="tiny muted" letter-spacing="1.3">CPU USAGE</text>
  <text x="277" y="226" font-size="32" font-weight="650">27.8%</text>
  <text x="277" y="248" class="tiny muted">Non-idle CPU time</text>
  <text x="674" y="189" class="tiny muted" letter-spacing="1.3">STACK WATERMARK</text>
  <text x="674" y="226" font-size="32" font-weight="650">42.3%</text>
  <text x="674" y="248" class="tiny muted">7,216 / 17,080 B · not total device RAM</text>
  <text x="1071" y="189" class="tiny muted" letter-spacing="1.3">HEAP USAGE</text>
  <text x="1071" y="226" font-size="32" font-weight="650">36.1%</text>
  <text x="1071" y="248" class="tiny muted">5,912 / 16,384 B</text>
  <rect x="1328" y="174" width="104" height="30" rx="6" fill="#302b46" stroke="#504564"/>
  <text x="1340" y="193" class="tiny">sys_heap ▾</text>
  <path d="M277 300H624M277 343H624M277 385H624M674 300H1021M674 343H1021M674 385H1021M1071 300H1431M1071 343H1431M1071 385H1431" class="grid"/>
  <path d="M277 364 300 359 325 367 350 349 376 352 402 336 430 343 456 314 480 328 506 319 530 337 558 324 585 345 624 313V390H277Z" fill="url(#cpu)"/>
  <path d="M277 364 300 359 325 367 350 349 376 352 402 336 430 343 456 314 480 328 506 319 530 337 558 324 585 345 624 313" fill="none" stroke="#ac91f5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M674 357 699 356 723 352 749 350 776 346 802 346 830 339 856 336 884 334 911 330 938 328 966 324 993 323 1021 319V390H674Z" fill="url(#stack)"/>
  <path d="M674 357 699 356 723 352 749 350 776 346 802 346 830 339 856 336 884 334 911 330 938 328 966 324 993 323 1021 319" fill="none" stroke="#69cbb1" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M1071 373 1100 372 1127 364 1156 360 1184 362 1213 342 1242 348 1270 335 1299 332 1327 337 1356 318 1383 324 1407 314 1431 310V390H1071Z" fill="url(#heap)"/>
  <path d="M1071 373 1100 372 1127 364 1156 360 1184 362 1213 342 1242 348 1270 335 1299 332 1327 337 1356 318 1383 324 1407 314 1431 310" fill="none" stroke="#75b3f1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Thread table -->
  <text x="258" y="457" class="medium" font-weight="600">All threads · 6</text>
  <text x="1135" y="457" class="tiny muted">Click to inspect · ↑/↓ select · Enter to inspect</text>
  <rect x="258" y="473" width="1192" height="359" rx="9" fill="#25223b" stroke="#39324e"/>
  <path d="M259 519H1449" class="line"/>
  <text x="279" y="502" class="tiny muted">NAME</text>
  <text x="850" y="502" class="tiny muted">CPU</text>
  <text x="969" y="502" class="tiny muted">LOAD</text>
  <text x="1090" y="502" class="tiny muted">STACK</text>
  <text x="1325" y="502" class="tiny muted">ACTIVITY</text>
  <rect x="265" y="525" width="1178" height="47" rx="5" fill="#3d365b"/>
  <g class="small">
    <text x="280" y="553">sensor_reader</text><text x="850" y="553">15.2%</text><text x="969" y="553">18.6%</text><text x="1090" y="553">1,120 / 2,048 B</text>
    <text x="280" y="604">telemetry_writer</text><text x="850" y="604">8.7%</text><text x="969" y="604">11.1%</text><text x="1090" y="604">928 / 2,048 B</text>
    <text x="280" y="655">network_worker</text><text x="850" y="655">2.1%</text><text x="969" y="655">3.4%</text><text x="1090" y="655">812 / 1,536 B</text>
    <text x="280" y="706">logger</text><text x="850" y="706">1.4%</text><text x="969" y="706">2.2%</text><text x="1090" y="706">600 / 1,024 B</text>
    <text x="280" y="757">main</text><text x="850" y="757">0.4%</text><text x="969" y="757">0.8%</text><text x="1090" y="757">464 / 1,024 B</text>
    <text x="280" y="808">sysworkq</text><text x="850" y="808">0.0%</text><text x="969" y="808">0.0%</text><text x="1090" y="808">576 / 1,024 B</text>
  </g>
  <path d="M265 574H1443M265 625H1443M265 676H1443M265 727H1443M265 778H1443" class="grid"/>
  <g fill="#69cbb1"><circle cx="1350" cy="548" r="5"/><circle cx="1350" cy="599" r="5"/><circle cx="1350" cy="650" r="5"/><circle cx="1350" cy="701" r="5"/></g>
  <g fill="none" stroke="#a59bb8" stroke-width="2"><circle cx="1350" cy="752" r="5" stroke-dasharray="2 2"/><circle cx="1350" cy="803" r="5" stroke-dasharray="2 2"/></g>
  <text x="258" y="852" class="tiny muted">Green activity icon: CPU activity since previous sample · Gray dashed circle: no observed activity or unavailable</text>
  <path d="M258 868H1450" class="line"/>
  <text x="258" y="895" class="tiny muted">Live target · nRF5340_xxAA · J-Link · zephyr.elf</text>
  <text x="1322" y="895" class="tiny muted">Updated just now</text>

  <!-- Open session menu: informational section and grouped actions -->
  <rect x="1076" y="76" width="374" height="383" rx="10" fill="#2c2843" stroke="#77669c" filter="url(#shadow)"/>
  <circle cx="1101" cy="105" r="5" fill="#69cbb1"/>
  <text x="1117" y="110" class="small" font-weight="650">Connected to target</text>
  <text x="1095" y="136" class="small">nRF5340_xxAA · J-Link</text>
  <text x="1095" y="157" class="tiny muted">zephyr.elf · Last sample just now</text>
  <path d="M1077 175H1449" class="line"/>
  <text x="1095" y="203" class="small">Connection details…</text>
  <text x="1095" y="244" class="small">Refresh target</text>
  <text x="1095" y="285" class="small" fill="#f2b9ca">Disconnect</text>
  <path d="M1077 303H1449" class="line"/>
  <text x="1095" y="331" class="tiny muted" letter-spacing="1">OPEN ANOTHER SOURCE</text>
  <text x="1095" y="365" class="small">Open dump…</text>
  <text x="1095" y="405" class="small">Open recording…</text>
  <path d="M1077 420H1449" class="line"/>
  <text x="1095" y="443" class="tiny muted">Opening another source disconnects the target.</text>
</svg>
